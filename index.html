<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ORBIT — Dog in Space</title>

  <meta
    name="description"
    content="ORBIT — Dog in Space. Official ORBIT project website."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      background: #020611;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #020611;
      overflow-x: hidden;
    }

    .site {
      position: relative;
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      line-height: 0;
    }

    .site-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /*
      Áreas transparentes colocadas sobre os
      botões existentes na própria imagem.
    */

    .click-area {
      position: absolute;
      display: block;
      z-index: 10;

      border: 0;
      padding: 0;
      margin: 0;

      background: transparent;
      cursor: pointer;
    }

    .click-area:focus-visible {
      outline: 2px solid #42dfff;
      outline-offset: 2px;
      border-radius: 6px;
    }

    #message {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform:
        translateX(-50%)
        translateY(20px);

      padding: 12px 18px;

      border: 1px solid #42dfff;
      border-radius: 10px;

      background: #061325;
      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;
      font-weight: bold;

      box-shadow:
        0 0 25px
        rgba(31, 169, 255, 0.45);

      opacity: 0;
      pointer-events: none;

      transition: 0.2s;

      z-index: 1000;
    }

    #message.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }
  </style>
</head>


<body>

  <div class="site" id="site">

      ESTA É A IMAGEM COMPLETA DO DESIGN.

      Coloque orbit-site.png
      na mesma pasta do index.html.

    <!-- MENU SUPERIOR -->
    <!-- ============================= -->

  <div id="message">
    Contract copied 🚀
  </div>


  <script>

    const CONTRACT =
      "0x3D42d61616EA2E48CA4Bd6a9e15BC443d1F76dE4";


    function copyContract() {

      navigator.clipboard
        .writeText(CONTRACT)
        .then(function () {

          const message =
            document.getElementById("message");

          message.classList.add("show");


          clearTimeout(
            window.contractMessageTimer
          );


          window.contractMessageTimer =
            setTimeout(function () {

              message.classList.remove(
                "show"
              );

            }, 1600);

        });

    }


    function goTo(position) {

      const image =
        document.getElementById(
          "siteImage"
        );


      const site =
        document.getElementById(
          "site"
        );


      const destination =
        site.offsetTop +
        image.clientHeight *
        position;


      window.scrollTo({

        top: destination,

        behavior: "smooth"

      });

    }

  </script>

</body>
</html>
