<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

    name="viewport"
    content="width=device-width, initial-scale=1.0"

  <title>ORBIT — Dog in Space</title>

    name="description"
    content="ORBIT — Dog in Space. Official ORBIT project website."

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      background: #020611;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #020611;
      overflow-x: hidden;
    }

    .site {
      position: relative;
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      line-height: 0;
    }

    .site-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }


    /* ===================================== */
    /* CLICKABLE AREAS */
    /* ===================================== */

    .click-area {
      position: absolute;
      display: block;
      z-index: 10;

      border: 0;
      padding: 0;
      margin: 0;

      background: transparent;
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .click-area:focus-visible {
      outline: 2px solid #42dfff;
      outline-offset: 2px;
      border-radius: 6px;
    }


    /* ===================================== */
    /* NOTIFICATION */
    /* ===================================== */

    #message {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform:
        translateX(-50%)
        translateY(20px);

      padding: 12px 18px;

      border: 1px solid #42dfff;
      border-radius: 10px;

      background: #061325;
      color: white;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: bold;

      box-shadow:
        0 0 25px rgba(31,169,255,0.45);

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 0.2s,
        transform 0.2s;

      z-index: 1000;
    }

    #message.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* ===================================== */
    /* 🚀 ROCKETS */
    /* ===================================== */

    .rocket-fx {
      position: fixed;

      bottom: -120px;

      z-index: 6;

      pointer-events: none;
      user-select: none;

      line-height: 1;

      will-change:
        transform,
        opacity;

      filter:
        drop-shadow(
          0 0 7px
          rgba(61,173,255,0.95)
        )
        drop-shadow(
          0 0 15px
          rgba(255,130,40,0.8)
        );

      animation-name: orbitRocketFly;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }


    @keyframes orbitRocketFly {

      0% {
        transform:
          translate3d(0,0,0)
          rotate(-45deg);

        opacity: 0;
      }

      8% {
        opacity: 1;
      }

      50% {
        transform:
          translate3d(
            var(--drift-half),
            -65vh,
            0
          )
          rotate(-45deg);

        opacity: 1;
      }

      88% {
        opacity: 1;
      }

      100% {
        transform:
          translate3d(
            var(--drift),
            -140vh,
            0
          )
          rotate(-45deg);

        opacity: 0;
      }

    }


    /* ===================================== */
    /* ☄️ SHOOTING STARS */
    /* ===================================== */

    .shooting-star-fx {
      position: fixed;

      z-index: 5;

      pointer-events: none;
      user-select: none;

      width: 4px;
      height: 4px;

      border-radius: 50%;

      background: #ffffff;

      box-shadow:
        0 0 6px #ffffff,
        0 0 12px #65cfff,
        0 0 24px #258cff;

      animation-name: shootingStarFly;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }


    .shooting-star-fx::after {
      content: "";

      position: absolute;

      right: 0;
      top: 1px;

      width: 110px;
      height: 2px;

      background:
        linear-gradient(
          to left,
          rgba(255,255,255,0.95),
          rgba(79,196,255,0.65),
          transparent
        );

      transform-origin: right center;
    }


    @keyframes shootingStarFly {

      0% {
        transform:
          translate3d(0,0,0)
          rotate(-35deg);

        opacity: 0;
      }

      7% {
        opacity: 1;
      }

      82% {
        opacity: 1;
      }

      100% {
        transform:
          translate3d(
            135vw,
            82vh,
            0
          )
          rotate(-35deg);

        opacity: 0;
      }

    }


    /* ===================================== */
    /* 🛸 UFOs */
    /* ===================================== */

    .ufo-fx {
      position: fixed;

      left: -160px;

      z-index: 5;

      pointer-events: none;
      user-select: none;

      line-height: 1;

      will-change:
        transform,
        opacity;

      filter:
        drop-shadow(
          0 0 8px
          rgba(83,255,220,0.95)
        )
        drop-shadow(
          0 0 20px
          rgba(80,110,255,0.85)
        );

      animation-name: ufoFly;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }


    @keyframes ufoFly {

      0% {
        transform:
          translate3d(-160px,0,0)
          rotate(-4deg);

        opacity: 0;
      }

      7% {
        opacity: 1;
      }

      35% {
        transform:
          translate3d(45vw,-18px,0)
          rotate(3deg);
      }

      55% {
        transform:
          translate3d(70vw,20px,0)
          rotate(-3deg);
      }

      75% {
        transform:
          translate3d(95vw,-12px,0)
          rotate(3deg);
      }

      90% {
        opacity: 1;
      }

      100% {
        transform:
          translate3d(130vw,5px,0)
          rotate(-2deg);

        opacity: 0;
      }

    }


    /* ===================================== */
    /* REDUCED MOTION */
    /* ===================================== */

    @media (prefers-reduced-motion: reduce) {

      .rocket-fx,
      .shooting-star-fx,
      .ufo-fx {
        display: none !important;
      }

    }


    /* LIQUIDITY LIVE */
    .liquidity-live{position:fixed;right:18px;bottom:18px;z-index:900;width:min(360px,calc(100vw - 36px));padding:14px;border:1px solid rgba(66,223,255,.8);border-radius:14px;background:rgba(2,6,17,.94);color:#fff;font-family:Arial,Helvetica,sans-serif;line-height:1.35;box-shadow:0 0 28px rgba(31,169,255,.28);backdrop-filter:blur(8px)}
    .liquidity-title{color:#5cff85;font-size:15px;font-weight:800;letter-spacing:.04em}
    .liquidity-pair{margin-top:4px;font-size:13px;font-weight:700}
    .liquidity-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .liquidity-actions a{flex:1 1 95px;padding:9px 10px;border:1px solid #2c7dff;border-radius:8px;color:#fff;background:#0755d9;text-align:center;text-decoration:none;font-size:11px;font-weight:800}
    .trading-alert{margin-top:10px;color:#cbd8f4;font-size:11px}
    .trading-alert strong{color:#ffd84d}
    @media(max-width:700px){.liquidity-live{right:10px;bottom:10px;width:calc(100vw - 20px)}}

  </style>

  <script>

    /* ===================================== */
    /* OFFICIAL CONTRACT */
    /* ===================================== */

    const CONTRACT =
      "0x3D42d61616EA2E48CA4Bd6a9e15BC443d1F76dE4";


    /* ===================================== */
    /* NAVIGATION POSITIONS */
    /* ===================================== */

    const sections = {
      home: 0,
      meme: 0.34,
      token: 0.625,
      tokenomics: 0.625,
      contract: 0.625,
      security: 0.765,
      roadmap: 0.84
    };


    /* ===================================== */
    /* MESSAGE */
    /* ===================================== */

    function showMessage(text) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.classList.add("show");

      clearTimeout(
        window.orbitMessageTimer
      );

      window.orbitMessageTimer =
        setTimeout(
          function () {
            message.classList.remove(
              "show"
            );
          },
          1700
        );
    }


    /* ===================================== */
    /* COPY CONTRACT */
    /* ===================================== */

    async function copyContract() {

      try {

        if (
          navigator.clipboard &&
          window.isSecureContext
        ) {

          await navigator.clipboard
            .writeText(CONTRACT);

        } else {

          fallbackCopy(CONTRACT);

        }

        showMessage(
          "Contract copied 🚀"
        );

      } catch (error) {

        try {

          fallbackCopy(CONTRACT);

          showMessage(
            "Contract copied 🚀"
          );

        } catch (fallbackError) {

          showMessage(
            "Copy failed"
          );

        }

      }

    }


    function fallbackCopy(text) {

      const textarea =
        document.createElement(
          "textarea"
        );

      textarea.value = text;

      textarea.setAttribute(
        "readonly",
        ""
      );

      textarea.style.position =
        "fixed";

      textarea.style.opacity =
        "0";

      textarea.style.pointerEvents =
        "none";

      document.body.appendChild(
        textarea
      );

      textarea.select();

      textarea.setSelectionRange(
        0,
        textarea.value.length
      );

      const successful =
        document.execCommand(
          "copy"
        );

      document.body.removeChild(
        textarea
      );

      if (!successful) {
        throw new Error(
          "Copy failed"
        );
      }
    }


    /* ===================================== */
    /* NAVIGATION */
    /* ===================================== */

    function goToSection(name) {

      const position =
        sections[name];

      if (
        typeof position !== "number"
      ) {
        return;
      }

      const image =
        document.getElementById(
          "siteImage"
        );

      const site =
        document.getElementById(
          "site"
        );

      const destination =
        site.offsetTop +
        image.clientHeight *
        position;

      window.scrollTo({
        top: destination,
        behavior: "smooth"
      });

    }


    /* ===================================== */
    /* 🚀 RANDOM ROCKET */
    /* ===================================== */

    function launchRandomRocket() {

      if (reduceMotion()) {
        return;
      }

      const rocket =
        document.createElement("div");

      rocket.className =
        "rocket-fx";

      rocket.textContent =
        "🚀";

      rocket.style.left =
        Math.random() * 96 + "vw";


      const size =
        24 +
        Math.random() * 41;

      rocket.style.fontSize =
        size + "px";


      const duration =
        6 +
        Math.random() * 6;

      rocket.style.animationDuration =
        duration + "s";


      const drift =
        -100 +
        Math.random() * 200;

      rocket.style.setProperty(
        "--drift",
        drift + "px"
      );

      rocket.style.setProperty(
        "--drift-half",
        drift / 2 + "px"
      );


      document.body.appendChild(
        rocket
      );


      setTimeout(
        function () {
          rocket.remove();
        },
        duration * 1000 + 1000
      );

    }


    function rocketLoop() {

      launchRandomRocket();

      const nextLaunch =
        1700 +
        Math.random() * 3000;

      window.orbitRocketTimer =
        setTimeout(
          rocketLoop,
          nextLaunch
        );

    }


    /* ===================================== */
    /* ☄️ SHOOTING STAR */
    /* ===================================== */

    function launchShootingStar() {

      if (reduceMotion()) {
        return;
      }

      const star =
        document.createElement("div");

      star.className =
        "shooting-star-fx";


      /*
        Start somewhere around the
        upper-left region of the screen.
      */

      star.style.top =
        Math.random() * 35 + "vh";

      star.style.left =
        (-120 +
        Math.random() * 100) +
        "px";


      const duration =
        1.3 +
        Math.random() * 1.2;

      star.style.animationDuration =
        duration + "s";


      document.body.appendChild(
        star
      );


      setTimeout(
        function () {
          star.remove();
        },
        duration * 1000 + 500
      );

    }


    function shootingStarLoop() {

      launchShootingStar();


      /*
        Approximately one shooting star
        every 6–15 seconds.
      */

      const nextStar =
        6000 +
        Math.random() * 9000;


      window.orbitStarTimer =
        setTimeout(
          shootingStarLoop,
          nextStar
        );

    }


    /* ===================================== */
    /* 🛸 RANDOM UFO */
    /* ===================================== */

    function launchUFO() {

      if (reduceMotion()) {
        return;
      }

      const ufo =
        document.createElement("div");

      ufo.className =
        "ufo-fx";

      ufo.textContent =
        "🛸";


      /*
        Different vertical positions.
      */

      ufo.style.top =
        (
          10 +
          Math.random() * 65
        ) + "vh";


      /*
        Different UFO sizes.
      */

      const size =
        36 +
        Math.random() * 35;

      ufo.style.fontSize =
        size + "px";


      /*
        Slow fly-by.
      */

      const duration =
        8 +
        Math.random() * 6;

      ufo.style.animationDuration =
        duration + "s";


      document.body.appendChild(
        ufo
      );


      setTimeout(
        function () {
          ufo.remove();
        },
        duration * 1000 + 1000
      );

    }


    function ufoLoop() {

      launchUFO();


      /*
        UFOs are intentionally rare:
        about every 18–40 seconds.
      */

      const nextUFO =
        18000 +
        Math.random() * 22000;


      window.orbitUFOTimer =
        setTimeout(
          ufoLoop,
          nextUFO
        );

    }


    /* ===================================== */
    /* ACCESSIBILITY */
    /* ===================================== */

    function reduceMotion() {

      return window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

    }


    /* ===================================== */
    /* START SPACE EFFECTS */
    /* ===================================== */

    window.addEventListener(
      "load",
      function () {

        if (reduceMotion()) {
          return;
        }


        /*
          🚀 First rocket:
          about 1 second.
        */

        setTimeout(
          rocketLoop,
          900
        );


        /*
          ☄️ First shooting star:
          about 4 seconds.
        */

        setTimeout(
          shootingStarLoop,
          4000
        );


        /*
          🛸 First UFO:
          about 10 seconds.
        */

        setTimeout(
          ufoLoop,
          10000
        );

      }
    );


    /* ===================================== */
    /* PREVENT ARTWORK DRAGGING */
    /* ===================================== */

    document
      .getElementById("siteImage")
      .addEventListener(
        "dragstart",
        function (event) {
          event.preventDefault();
        }
      );

  </script>
